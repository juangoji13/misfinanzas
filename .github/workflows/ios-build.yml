name: Build iOS Unsigned IPA (For Loadly)

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-15 # Ensures we have Xcode 16+ for Expo SDK 52+

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci
        
      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }} # (Optional) If you use EAS services, otherwise can be omitted if just using prebuild

      - name: Inject Environment Variables
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=http://149.130.186.213:8000" >> .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyAgCiAgICAicm9sZSI6ICJhbm9uIiwKICAgICJpc3MiOiAic3VwYWJhc2UtZGVtbyIsCiAgICAiaWF0IjogMTY0MTc2OTIwMCwKICAgICJleHAiOiAxNzk5NTM1NjAwCn0.dc_X5iR_VP_qT0zsiyj_I_OZ2T9FtRU2BBNWN8Bu4GE" >> .env

      - name: Prebuild iOS Project
        run: npx expo prebuild --platform ios --clean

      - name: Build Unsigned iOS App
        run: |
          cd ios
          # Build the release app for ARM64 (real device) but disable all signing checks
          # Using CONFIGURATION_BUILD_DIR breaks CocoaPods. Let Xcode build to default DerivedData.
          xcodebuild -workspace FinanzasJG.xcworkspace \
            -scheme FinanzasJG \
            -configuration Release \
            -sdk iphoneos \
            -allowProvisioningUpdates=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package to .ipa
        run: |
          cd ios
          # Locate the built .app in Xcode's DerivedData folder
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "FinanzasJG.app" -type d | head -n 1)
          
          mkdir Payload
          # Move the .app into Payload (required structure for IPA)
          mv "$APP_PATH" Payload/
          # Zip it into an IPA
          zip -r finanzas-jg-unsigned.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: finanzas-jg-unsigned
          path: ios/finanzas-jg-unsigned.ipa
          retention-days: 7
